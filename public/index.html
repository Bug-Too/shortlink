<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shortlink — short links &amp; QR codes</title>
<meta name="description" content="Paste a link, get a short link and a QR code. Nothing is saved on a server.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap">

  <header class="head">
    <h1>Shortlink</h1>
    <p>Paste a link. Get a short link and a QR code.</p>
  </header>

  <!-- ---------------------------------------------------------- input -->
  <section class="card">
    <textarea id="input" class="input" rows="2" enterkeyhint="go" autocapitalize="off"
              autocomplete="off" autocorrect="off" spellcheck="false"
              placeholder="Paste a link…"></textarea>

    <div class="under-input">
      <label class="check">
        <input id="clean" type="checkbox" checked>
        <span>Remove tracking junk</span>
      </label>
      <button id="paste" class="text-btn" type="button">Paste</button>
    </div>

    <button id="go" class="btn btn-primary wide" type="button">Shorten</button>
    <p id="note" class="note" hidden></p>
  </section>

  <!-- ------------------------------------------------------- shortened -->
  <section id="result" class="card" hidden>
    <p class="label">Short link</p>
    <button id="short-url" class="short-url" type="button" title="Tap to copy"></button>
    <div class="row">
      <button id="copy" class="btn btn-primary" type="button">Copy</button>
      <button id="share" class="btn" type="button">Share</button>
      <a id="open" class="btn" target="_blank" rel="noreferrer noopener">Open</a>
    </div>
  </section>

  <!-- -------------------------------------------------------------- qr -->
  <section id="qr-card" class="card" hidden>
    <p class="label">QR code</p>
    <div class="qr-tile">
      <canvas id="qr" width="512" height="512" aria-label="QR code"></canvas>
    </div>
    <p id="qr-for" class="qr-for"></p>
    <div class="row">
      <button id="save-qr" class="btn" type="button">Save</button>
      <button id="share-qr" class="btn" type="button">Share</button>
    </div>
    <p class="centered"><button id="poster" class="text-btn" type="button">Save as poster</button></p>
  </section>

  <!-- ---------------------------------------------------------- recent -->
  <section id="recent-section" class="recent" hidden>
    <div class="recent-head">
      <p class="label">Recent</p>
      <button id="forget" class="text-btn" type="button">Clear</button>
    </div>
    <ul id="recent" class="recent-list"></ul>
  </section>

  <footer class="foot">
    <p>Nothing is saved on a server. Recent links stay in this browser.</p>
  </footer>

</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<canvas id="scratch" hidden></canvas>

<script src="vendor/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
